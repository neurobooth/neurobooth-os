name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The deploy tool runs outside the booth venv and is tested against a
  # simulated three-machine booth, so it is exercised on every OS. On Windows
  # the agents also run through the real Task Scheduler.
  deploy:
    name: deploy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Run deploy tests (Python 3.8, as on the booths)
        env:
          NB_DEPLOY_TEST_SCHTASKS: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: >
          uv run --no-project --python 3.8
          --with pytest --with "pyyaml>=6.0" --with "pydantic>=2.5.2"
          python -m pytest tests/pytest/deploy -o addopts="" -v

  # The full suite needs the booth venv, which uv.lock only resolves for Windows,
  # and a loaded booth config (neurobooth_os/iout/lsl_streamer.py loads it at
  # import), so it runs against the private configs repo's all-mocked
  # local_test environment, as on a developer machine. The workflow's own
  # GITHUB_TOKEN can only read this repo, so reading configs needs the
  # CONFIGS_DEPLOY_KEY secret: the private half of a read-only deploy key
  # added to neurobooth/configs (see docs/deployment.md, "Continuous integration").
  full-suite:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for the configs deploy key
        shell: bash
        env:
          CONFIGS_DEPLOY_KEY: ${{ secrets.CONFIGS_DEPLOY_KEY }}
        run: |
          if [ -z "$CONFIGS_DEPLOY_KEY" ]; then
            echo "::error::Secret CONFIGS_DEPLOY_KEY is not set; the full suite needs read access to neurobooth/configs."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: neurobooth/configs
          ssh-key: ${{ secrets.CONFIGS_DEPLOY_KEY }}
          path: configs-checkout
          persist-credentials: false
      - name: Stage the local_test config (what configs/deploy.bat does)
        shell: bash
        run: |
          config_dir="$RUNNER_TEMP/neurobooth_os_config"
          mkdir -p "$config_dir"
          cp -r configs-checkout/shared/. "$config_dir"
          cp -r configs-checkout/environments/local_test/. "$config_dir"
          printf 'local:\n  database:\n    password: "not-used-in-tests"\n' > "$config_dir/secrets.yaml"
          echo "NB_CONFIG=$config_dir" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install the booth environment
        run: uv sync --locked
      - name: Run all tests
        run: uv run --locked python -m pytest -v

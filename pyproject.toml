[build-system]
requires = ["setuptools>=42.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurobooth-os"
description = "Code for database management for Neurobooth application."
readme = "README.md"
license = {text = "BSD-3-Clause"}
maintainers = [
    {name = "Adonay Nunes", email = "adonay.s.nunes@gmail.com"},
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved",
    "Programming Language :: Python",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
]
requires-python = ">=3.11"
# Decoupled from runtime version metadata. neurobooth_os/current_release.py
# is for cross-service consistency checks and DB session-version logging;
# neurobooth_os/current_config.py is for the configs repo's version. Neither
# is the package's build version.
version = "0.0.0+dev"
dependencies = [
    # Scientific stack
    # numpy is held below 2.0 so the psychopy upgrade below is the only library
    # crossing a major version in one change. Lift with a test run behind it.
    "numpy>=1.23.5,<2",
    "scipy>=1.10.1",
    "pandas>=2.0.3",
    "matplotlib>=3.7.3",
    "xarray>=2023.1.0",
    "numexpr>=2.8.4",
    # Stimulus / psychophysics
    # 2025.2 is a hard floor, not a preference: every earlier series pins
    # pyobjc-framework-quartz<8.0 on darwin, which collides with pynput's
    # >=8.0 and makes the whole set unresolvable on macOS. Removing pynput
    # does not help -- the resolver then reaches back to pyobjc 2.2, which
    # fails to build. 2024.1.0 removed MovieStim3; call sites in
    # tasks/utils.py and tasks/smooth_pursuit/ were moved to MovieStim.
    "psychopy>=2025.2",
    "psychtoolbox>=3.0.19.0",
    "pyglet>=1.4.11",
    "questplus>=2023.1",
    # LSL / streaming / messaging
    "pylsl>=1.16.2",
    "liesl>=0.3.5.0",
    "pyxdf>=1.16.4",
    "pyzmq>=25.1.1",
    "websockets>=12.0",
    # File / storage formats
    "h5py>=3.10.0",
    "h5io>=0.2.1",
    "openpyxl>=3.1.2",
    "pyyaml>=6.0.1",
    "ujson>=5.8.0",
    "json-tricks>=3.17.3",
    "blosc2>=2.0.0",
    # Database / API
    "psycopg2-binary>=2.9.9",
    "pycap>=2.6.0",
    "pydantic>=2.5.2",
    "neurobooth-terra @ git+https://github.com/neurobooth/neurobooth-terra.git",
    # Networking
    "paramiko>=2.8.1",
    "sshtunnel>=0.4.0",
    "requests>=2.31.0",
    "requests-toolbelt>=1.0.0",
    "urllib3>=2.0.7",
    "python-gitlab>=4.1.1",
    "gitpython>=3.1.40",
    # GUI
    # FreeSimpleGUI (tkinter) is the only toolkit the code imports. pyqt5,
    # pyqt5-qt5, pyqt5-sip and wxpython had no import site anywhere in the
    # repo; they are psychopy's business, not ours, and declaring them
    # directly forced a wxpython source build on macOS. Let psychopy pull
    # what it needs.
    "FreeSimpleGUI>=5.2.0.post1",
    # Image / video
    "pillow>=10.0.1",
    # opencv and moviepy held below their next major for the same reason as
    # numpy above: one major-version crossing per change.
    "opencv-python>=4.8.1.78,<5",
    "imageio>=2.32.0",
    "imageio-ffmpeg>=0.4.9",
    "moviepy>=1.0.3,<2",
    "ffpyplayer>=4.5.1",
    "sk-video>=1.1.10",
    # Audio
    # pyaudio has no macOS wheel and needs PortAudio headers to build from
    # source. microphone.py already imports it lazily behind _require_pyaudio(),
    # and MockMicStream never touches it, so a mock session does not need it.
    "pyaudio>=0.2.13; sys_platform != 'darwin'",
    "soundfile>=0.12.1",
    # Hardware: cameras, wearables, input
    # The vendor SDKs below cannot be installed on macOS at all -- pyrealsense2
    # publishes no darwin wheel, and metawear/warble raise "not supported for
    # 'Darwin'" from their build backends. Every one of them is imported lazily
    # behind a _require_<sdk>() guard and has a registered mock, so a
    # hardware-less macOS session runs without them. See the extras below.
    "pynput>=1.7.6",
    # pyserial / pyparallel / pywinhook removed (#763): no direct import
    # anywhere in neurobooth_os/ or extras/. See docs/win11_vendor_compat.md
    # for the audit and the parallel-port-trigger caveat.
    # pywin32 / pypiwin32 / sounddevice / python-vlc removed on the same
    # grounds: no import site anywhere in the repo. The only Windows-API
    # import is stdlib winreg in extras/perf/mbient_soak.py, and gui.py's
    # Win32 calls go through stdlib ctypes.windll.
    # Crypto / security
    "cryptography>=41.0.5",
    "bcrypt>=3.2.0",
    "pynacl>=1.5.0",
    # Concurrency / runtime
    "gevent>=23.9.1",
    "greenlet>=3.0.1",
    "zope-event>=5.0",
    "zope-interface>=6.1",
    # Utility
    # setuptools is a runtime requirement here, not a build-time one: liesl's
    # cli_wrapper imports pkg_resources, which Python 3.12+ venvs no longer
    # provide by default. Without it `import liesl` fails, and with it
    # iphone.py, split_xdf.py and session_controller.py.
    # The upper bound is not cosmetic: setuptools 81 removed pkg_resources
    # outright (84.0.0 confirmed missing it), so liesl cannot import against a
    # current setuptools at all. This pin buys time; it is a standing argument
    # for retiring liesl rather than a stable position.
    "setuptools>=68,<81",
    "psutil>=5.9.6",
    "tqdm>=4.66.1",
    "py-cpuinfo>=9.0.0",
    "msgpack>=1.0.7",
    "msgpack-numpy>=0.4.8",
    "cython>=3.0.5",
    "ipython>=8.12.2",
    # Web / parsing helpers (psychopy ecosystem)
    "arabic-reshaper>=3.0.0",
    "astunparse>=1.6.3",
    "beautifulsoup4>=4.12.2",
    "html2text>=2020.1.16",
    "markdown-it-py>=3.0.0",
    "freetype-py>=2.4.0",
    "python-bidi>=0.4.2",
    "esprima>=4.0.1",
    "javascripthon>=0.12",
    "dukpy>=0.3.0",
    "elementpath>=4.1.5",
    "xmlschema>=2.5.0",
    "semantic-version>=2.10.0",
]

[project.optional-dependencies]
# STM machine: SR Research EyeLink eye tracker
eyelink = [
    "sr-research-pylink",
]
# ACQ machine: Mbient wearables. The SDK's build backend refuses to run on
# macOS ("MetaWear Python SDK not supported for 'Darwin'"), so the markers make
# this extra a no-op there rather than an error -- `uv sync --extra mbient` is
# then the same command on every machine. Use MockMbient on macOS.
mbient = [
    "metawear>=1.0.8; sys_platform != 'darwin'",
    "warble>=1.2.9; sys_platform != 'darwin'",
]
# ACQ machine: Intel RealSense depth camera. No macOS wheel is published at
# any version; same no-op-on-darwin treatment. Use MockVidRec_Intel on macOS.
realsense = [
    "pyrealsense2>=2.54.2.5684; sys_platform != 'darwin'",
]
# Everything a real booth needs, in one name.
booth = [
    "neurobooth-os[eyelink,mbient,realsense]",
]
# ACQ machine: FLIR Spinnaker SDK is installed separately from a local wheel
# (the wheel path is operator-local). Run after `uv sync`:
#   uv pip install <path>\spinnaker_python-3.x.x.x-cp311-cp311-win_amd64.whl

[project.scripts]
neurobooth_os = "neurobooth_os.gui:main"

[project.urls]
Homepage = "https://github.com/neurobooth/neurobooth-os"
Download = "https://github.com/neurobooth/neurobooth-os"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov",
    "ruff",
    "mypy",
    "sphinx",
]

[tool.uv]
extra-index-url = ["https://pypi.sr-support.com"]
# Booth machines run Windows; development and mock sessions also run on macOS
# and Linux. All three must resolve. The darwin conflicts that forced the old
# win32-only restriction are gone: psychopy's pyobjc-framework-quartz<8.0 pin
# was dropped in 2025.2, and the vendor SDKs that have no darwin build moved
# into extras above.
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]
# neurobooth-terra requires `psycopg2`, the C-extension distribution, which is
# sdist-only and needs libpq headers plus pg_config to build. We already depend
# directly on `psycopg2-binary`, which installs the very same `psycopg2` module
# from a prebuilt wheel. Drop terra's transitive on darwin so a Mac dev install
# needs no Postgres client toolchain; Windows and Linux keep the real build.
override-dependencies = ["psycopg2; sys_platform != 'darwin'"]

[tool.setuptools.packages.find]
include = ["neurobooth_os*"]

[tool.pytest.ini_options]
addopts = "--cov=neurobooth_os"
testpaths = [
    "neurobooth_os",
    "tests",
]

[tool.mypy]
mypy_path = "neurobooth_os"
check_untyped_defs = true
disallow_any_generics = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
no_implicit_reexport = true
